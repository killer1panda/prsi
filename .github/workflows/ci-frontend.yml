name: 🌐 Enterprise CI - Frontend & Mobile & Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-dashboard-ci:
    name: Next.js Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./apps/web
        run: npm install --legacy-peer-deps
      - name: Next.js Lint
        working-directory: ./apps/web
        continue-on-error: true
        run: npm run lint
      - name: Next.js Build Verification
        working-directory: ./apps/web
        run: npm run build

  mobile-expo-ci:
    name: React Native Expo CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: npm install --legacy-peer-deps
      - name: Expo Web Build Verification
        working-directory: ./apps/mobile
        run: npm run build

  desktop-tauri-ci:
    name: Tauri Desktop Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./apps/desktop
        run: npm install
      - name: Desktop Build Verification
        working-directory: ./apps/desktop
        run: npm run build
