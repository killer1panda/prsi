name: 🌐 Enterprise CI - Frontend & Mobile

on:
  push:
    paths: [ "apps/web/**", "apps/mobile/**", ".github/workflows/ci-frontend.yml" ]
  pull_request:
    paths: [ "apps/web/**", "apps/mobile/**" ]

permissions:
  contents: read

jobs:
  web-dashboard-ci:
    name: Next.js Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./apps/web
        run: npm install --legacy-peer-deps
      - name: Next.js Lint
        working-directory: ./apps/web
        continue-on-error: true
        run: npm run lint
      - name: Next.js Build Verification
        working-directory: ./apps/web
        run: npm run build

  mobile-expo-ci:
    name: React Native Expo CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: npm install --legacy-peer-deps
      - name: Basic Expo Check
        working-directory: ./apps/mobile
        run: npx expo export --platform web
