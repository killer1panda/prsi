name: Pristine Architecture CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-audit:
    name: 100% Codebase Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Python AST Compilation Check
      run: |
        echo "Executing full AST compilation across the repository..."
        python -m compileall -q .
        echo "✅ All Python files compiled successfully."

    - name: Generic Exceptions Audit
      run: |
        echo "Scanning for dangerous bare exceptions..."
        if grep -r "^[[:space:]]*except[[:space:]]*:" apps/backend/; then
          echo "❌ Failed: Found bare exceptions!"
          exit 1
        else
          echo "✅ No bare exceptions found."
        fi

  security-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'
