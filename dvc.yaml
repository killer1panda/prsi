stages:
  feature_engineering:
    cmd: python apps/backend/scripts/consolidate_datasets.py
    deps:
      - apps/backend/src/features/engineering.py
      - apps/backend/src/features/sentiment.py
      - apps/backend/src/features/toxicity.py
    outs:
      - data/processed_sample.csv:
          cache: true

  train_multimodal:
    cmd: python train_multimodal.py --data_path data/processed_sample.csv --epochs 5
    deps:
      - train_multimodal.py
      - apps/backend/src/models/gnn_model.py
      - apps/backend/src/models/fusion.py
      - apps/backend/src/models/multimodal_trainer.py
      - data/processed_sample.csv
    outs:
      - models/multimodal_doom/best_model.pt:
          cache: true

  evaluate:
    cmd: python apps/backend/src/evaluation/evaluate_full.py
    deps:
      - apps/backend/src/evaluation/evaluate_full.py
      - models/multimodal_doom/best_model.pt
    outs:
      - reports/evaluation/metrics.json:
          cache: false
